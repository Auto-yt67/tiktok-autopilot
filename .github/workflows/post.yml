name: Post Twitch Clip

on:
  schedule:
    - cron: '0 13 * * *'   # 8am ET
    - cron: '0 16 * * *'   # 11am ET
    - cron: '0 19 * * *'   # 2pm ET
    - cron: '0 22 * * *'   # 5pm ET
    - cron: '0 1 * * *'    # 8pm ET
    - cron: '0 4 * * *'    # 11pm ET
  workflow_dispatch:         # allow manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest posted.json / hashtag_state.json / best_times_cache.json
        run: git pull --rebase

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg tesseract-ocr
          wget -q https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          chmod +x /usr/local/bin/yt-dlp

      - name: Install font
        run: |
          mkdir -p /usr/share/fonts/truetype/baloo2
          curl -fL -o /usr/share/fonts/truetype/baloo2/Baloo2-Bold.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/baloo2/Baloo2-Bold.ttf"
          file /usr/share/fonts/truetype/baloo2/Baloo2-Bold.ttf | grep -qi "font\|TrueType\|data" \
            && echo "Font OK" || (echo "::error::Baloo2-Bold.ttf did not download correctly" && exit 1)
          fc-cache -f

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          PUBLER_API_KEY: ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID: ${{ secrets.PUBLER_WORKSPACE_ID }}
          PUBLER_ACCOUNT_ID: ${{ secrets.PUBLER_ACCOUNT_ID }}
        run: python tiktok_autopilot.py

      - name: Commit updated posted.json / hashtag_state.json / best_times_cache.json
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add posted.json hashtag_state.json best_times_cache.json
          git diff --staged --quiet || git commit -m "update posted.json / hashtag_state.json / best_times_cache.json [skip ci]"
          git push
