name: Post Twitch Clip

on:
  schedule:
    # Run all 3 early; best_times schedules each post for its best hour later
    # the same day. (ET → UTC assuming EDT / UTC-4.)
    - cron: '0 4 * * *'    # 12am ET
    - cron: '0 5 * * *'    # 1am ET
    - cron: '0 6 * * *'    # 2am ET
  workflow_dispatch:         # allow manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest posted.json / hashtag_state.json / best_times_cache.json
        run: git pull --rebase

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg tesseract-ocr fonts-dejavu-core
          wget -q https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          chmod +x /usr/local/bin/yt-dlp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          PUBLER_API_KEY: ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID: ${{ secrets.PUBLER_WORKSPACE_ID }}
          PUBLER_ACCOUNT_ID: ${{ secrets.PUBLER_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python tiktok_autopilot.py

      - name: Commit updated posted.json / hashtag_state.json / best_times_cache.json
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add posted.json hashtag_state.json best_times_cache.json
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "update posted.json / hashtag_state.json / best_times_cache.json [skip ci]"
          # Two runs can finish near-simultaneously and both try to push; if the
          # remote moved under us, rebase onto it and retry a few times instead
          # of failing the whole run.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected (attempt $i) — pulling and retrying..."
            git pull --rebase --autostash || true
            sleep 3
          done
          echo "::warning::Could not push state after retries (another run likely committed it)"
