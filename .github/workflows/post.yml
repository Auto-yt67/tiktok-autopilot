name: Post Twitch Clip

on:
  schedule:
    - cron: '0 13 * * *'   # 8am ET
    - cron: '0 16 * * *'   # 11am ET
    - cron: '0 19 * * *'   # 2pm ET
    - cron: '0 22 * * *'   # 5pm ET
    - cron: '0 1 * * *'    # 8pm ET
    - cron: '0 4 * * *'    # 11pm ET
  workflow_dispatch:         # allow manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest posted.json / hashtag_state.json / best_times_cache.json
        run: git pull --rebase

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg tesseract-ocr fonts-dejavu-core
          wget -q https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          chmod +x /usr/local/bin/yt-dlp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write YouTube cookies
        run: |
          printf '%s' "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          # Sanity check — a valid Netscape cookie file starts with this header.
          head -1 cookies.txt | grep -q "# HTTP Cookie File\|# Netscape" \
            && echo "Cookies look OK" || echo "::warning::cookies.txt may be malformed"

      - name: Run bot
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          PUBLER_API_KEY: ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID: ${{ secrets.PUBLER_WORKSPACE_ID }}
          PUBLER_ACCOUNT_ID: ${{ secrets.PUBLER_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python tiktok_autopilot.py

      - name: Commit updated posted.json / hashtag_state.json / best_times_cache.json
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add posted.json hashtag_state.json best_times_cache.json
          git diff --staged --quiet || git commit -m "update posted.json / hashtag_state.json / best_times_cache.json [skip ci]"
          git push
